spring:
  application:
    name: swipet-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:swipet}
    username: ${POSTGRES_USER:swipet_user}
    password: ${POSTGRES_PASSWORD:secret}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:5MB}
      max-request-size: ${MAX_UPLOAD_SIZE:5MB}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true

# --- Swipet domain config ---
swipet:
  jwt:
    secret: ${JWT_SECRET:change-me-please-min-256-bit-secret-change-me-please-min-256-bit-secret}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION:604800}
    issuer: ${JWT_ISSUER:swipet-backend}
  storage:
    # Active backend: "minio" (MinIO / S3) or "mock" (in-memory, for tests / local dev without MinIO)
    backend: ${STORAGE_BACKEND:minio}
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${MINIO_SECRET_KEY:minioadmin}
      bucket: ${MINIO_BUCKET:swipet-media}
      public-url: ${MINIO_PUBLIC_URL:}
      auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:8081,http://localhost:19006}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    ua.edu.ukma.swipet: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}

stripe:
  api-key: ${STRIPE_API_KEY:sk_test_твоя_тестова_апі_кея}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_твій_вебхук_секрет}
