# Production overrides for docker-compose.yml.
#
#   docker compose --env-file .env.production \
#     -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Goal: only the reverse proxy (nginx) is reachable from the host. Everything
# else talks over the internal `swipet` network — no Postgres/MinIO/backend
# ports leaked to the public box.

services:
  postgres:
    # Keep the data port internal-only.
    ports: []

  minio:
    # Media is served via nginx /media/; console/API stay internal.
    ports: []

  backend:
    ports: []
    environment:
      SPRING_PROFILES_ACTIVE: docker

  chat-service:
    ports: []

  frontend:
    ports: []

  nginx:
    # The single public surface.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
