user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 15m;

    # --- Rate limit zones (declared once, used per-location) ----------------
    # 30 req/s per client IP for auth endpoints (INF-011).
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/s;
    # 100 req/s per client IP for the rest of the API (sane default).
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=100r/s;

    limit_req_status 429;

    # --- Upstreams ----------------------------------------------------------
    upstream backend_upstream {
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream chat_upstream {
        server chat-service:3001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Об'єктне сховище (MinIO/S3) — щоб віддавати медіа через той самий https-origin
    # і не ловити mixed-content на вебі (аватари на https-сторінці).
    upstream minio_upstream {
        server minio:9000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # gzip
    gzip on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain application/xml;
    gzip_min_length 1024;

    include /etc/nginx/conf.d/*.conf;
}
