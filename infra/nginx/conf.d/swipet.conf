# --- Reusable security headers --------------------------------------------
# В nginx директиви `add_header` не наслідуються, якщо у вкладеному location
# теж є `add_header`. Тому виносимо у map і застосовуємо явно у кожному блоці.

map $sent_http_content_type $swipet_csp {
    default "default-src 'self'; img-src 'self' data: https: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' http: https: ws: wss:; frame-ancestors 'none'; base-uri 'self'";
}

# HSTS лише для реальних доменів. На localhost/127.0.0.1 self-signed cert + HSTS
# «отруює» браузер на рік (блокує bypass cert-помилки для УСІХ localhost-проєктів),
# тому там заголовок не шлемо. Порожнє значення → nginx не додає заголовок.
map $host $swipet_hsts {
    default                 "max-age=31536000; includeSubDomains";
    "~*^localhost"          "";
    "~*^127\.0\.0\.1"       "";
}

# --- Plain HTTP: тільки health + 301 redirect на HTTPS --------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Health для docker compose / k8s probes — НЕ редиректимо.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok\n";
    }

    # Все інше — редірект на HTTPS (для прод-готовності).
    # У dev це може дратувати: можна тимчасово закоментувати.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (self-signed для demo, INF-013) --------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/swipet.crt;
    ssl_certificate_key /etc/nginx/certs/swipet.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers (INF-012) ---------------------------------------
    add_header X-Frame-Options          "DENY"             always;
    add_header X-Content-Type-Options   "nosniff"          always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(self), microphone=(), camera=()" always;
    add_header Strict-Transport-Security $swipet_hsts always;
    add_header Content-Security-Policy  $swipet_csp       always;

    # --- Health (no rate limit) -------------------------------------------
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain";
        return 200 "ok\n";
    }

    # --- Auth endpoints: 30 req/s (INF-011) -------------------------------
    location ~ ^/api/v1/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://backend_upstream;
    }

    # --- Решта Core Backend API -------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=50 nodelay;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://backend_upstream;
    }

    # --- Swagger / OpenAPI (read-only docs) -------------------------------
    # Springdoc редіректить /swagger-ui -> /swagger-ui/index.html?configUrl=...
    # тому потрібен той самий набір proxy_set_header, що й для /api/*,
    # інакше Tomcat бачить Host: backend_upstream і кидає 400.
    location /swagger-ui {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://backend_upstream;
    }
    location /api-docs {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_upstream;
    }
    location /v3/api-docs {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://backend_upstream;
    }

    # --- Media (MinIO/S3) через https-origin -------------------------------
    # Аватари/фото віддаються як https://$host/media/<bucket>/<key>, тому на
    # вебі немає mixed-content і картинки не «зникають» після релогіну.
    location /media/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Трейлінг-слеш зрізає префікс /media/ → minio отримує /<bucket>/<key>.
        proxy_pass http://minio_upstream/;
    }

    # --- WebSocket / Socket.io --------------------------------------------
    location /socket.io/ {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_pass http://chat_upstream;
    }

    # --- Frontend (React Native Expo web) ----------------------------------
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://frontend_upstream;
    }
}
