name: Deploy chat-service (Node)

# Mirror of deploy-backend, but scoped to chat-service/** so the two backends
# are built and rolled out completely independently.
on:
  push:
    branches: [main]
    paths:
      - "chat-service/**"
      - ".github/workflows/deploy-chat-service.yml"
  workflow_dispatch:

concurrency:
  group: deploy-chat-service
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SERVICE: chat-service
  CONTEXT: ./chat-service
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/swipet-chat-service

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        env:
          SHA: ${{ github.sha }}
        run: |
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" "$CONTEXT"
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy this service on EC2 via SSM
        env:
          INSTANCE_ID: ${{ vars.SSM_INSTANCE_ID }}
        run: |
          set -euo pipefail
          PARAMS=$(jq -n --arg svc "$SERVICE" '{
            commands: [
              "set -euo pipefail",
              "cd /opt/swipet",
              "docker compose pull \($svc)",
              "docker compose up -d --no-deps \($svc)",
              "docker image prune -f"
            ]
          }')

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${SERVICE} ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' --output text)
          echo "SSM command: $CMD_ID"

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query 'Status' --output text)
          echo "Deploy status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text
            exit 1
          fi
